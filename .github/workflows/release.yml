name: Build and deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured server after publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fgas-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Choose unique image version
        id: images
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
        shell: bash
        run: |
          test -n "$ACR_REGISTRY" && test -n "$ACR_NAMESPACE"
          prefix="$ACR_REGISTRY/$ACR_NAMESPACE/fgas"
          version="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build images
        env:
          PREFIX: ${{ steps.images.outputs.prefix }}
          VERSION: ${{ steps.images.outputs.version }}
        run: |
          docker build --platform linux/amd64 --build-arg "FGAS_VERSION=$VERSION" --build-arg "FGAS_GIT_SHA=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -f deploy/Dockerfile -t "$PREFIX-api:$VERSION" .
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -f deploy/Dockerfile.web -t "$PREFIX:$VERSION" .
          FGAS_WEB_IMAGE="$PREFIX:$VERSION" bash scripts/package-release.sh "$VERSION" --registry "$PREFIX"
      - name: Check containers and Nginx
        env:
          PREFIX: ${{ steps.images.outputs.prefix }}
          VERSION: ${{ steps.images.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/fgas/releases"
          tar -xzf ".releases/fgas-$VERSION.tar.gz" -C "$RUNNER_TEMP/fgas/releases"
          cp deploy/env.example "$RUNNER_TEMP/fgas/.env"
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" "$RUNNER_TEMP/fgas/.env"
          # The smoke test runs offline; give Casdoor config placeholders so startup validation passes.
          sed -i \
            -e 's|^CASDOOR_ISSUER=.*|CASDOOR_ISSUER=https://idp.example.test|' \
            -e 's|^CASDOOR_CLIENT_ID=.*|CASDOOR_CLIENT_ID=ci-client|' \
            -e 's|^CASDOOR_CLIENT_SECRET=.*|CASDOOR_CLIENT_SECRET=ci-secret|' \
            -e 's|^CASDOOR_REDIRECT_URI=.*|CASDOOR_REDIRECT_URI=https://fgas.example.test/api/auth/casdoor/callback|' \
            -e 's|^INITIAL_ADMIN_SUBJECT=.*|INITIAL_ADMIN_SUBJECT=ci-admin|' \
            "$RUNNER_TEMP/fgas/.env"
          # Exercise the same complete-image loading path as an offline manual release.
          docker pull postgres:14
          docker image save -o "$RUNNER_TEMP/fgas/releases/fgas-$VERSION/images.tar" "$PREFIX-api:$VERSION" "$PREFIX:$VERSION" postgres:14
          bash "$RUNNER_TEMP/fgas/releases/fgas-$VERSION/apply-release.sh" --init-db
          docker compose --project-name fgas --env-file "$RUNNER_TEMP/fgas/.env" --env-file "$RUNNER_TEMP/fgas/releases/fgas-$VERSION/release.env" -f "$RUNNER_TEMP/fgas/releases/fgas-$VERSION/compose.yaml" run --rm --no-deps migrate alembic -c alembic.ini check
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/api/auth/config | grep -q '"mode":"casdoor"'
          curl --fail http://127.0.0.1:8080/ > /dev/null
          curl --fail http://127.0.0.1:8080/agent-setup.md > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/mcp)" = 401
      - name: Publish to Aliyun ACR
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          PREFIX: ${{ steps.images.outputs.prefix }}
          VERSION: ${{ steps.images.outputs.version }}
        run: |
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
          docker push "$PREFIX-api:$VERSION"
          docker push "$PREFIX:$VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: fgas-release
          path: .releases/*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
      - name: Deploy with Coolify
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true')
        env:
          COOLIFY_URL: https://coolify.secret-sealing.club
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          FGAS_API_IMAGE: ${{ steps.images.outputs.prefix }}-api:${{ steps.images.outputs.version }}
          FGAS_WEB_IMAGE: ${{ steps.images.outputs.prefix }}:${{ steps.images.outputs.version }}
        run: python3 scripts/deploy-coolify.py
