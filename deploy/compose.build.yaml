# Source-checkout builds only. The SSH release uses compose.yaml without this file.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        FGAS_VERSION: ${FGAS_VERSION:-dev}
        FGAS_GIT_SHA: ${FGAS_GIT_SHA:-}
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        FGAS_VERSION: ${FGAS_VERSION:-dev}
        FGAS_GIT_SHA: ${FGAS_GIT_SHA:-}
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
